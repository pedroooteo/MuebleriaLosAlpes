<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Muebles de los Alpes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .item-card { border: none; border-radius: 10px; }
        .total-footer { background: linear-gradient(135deg,#198754,#20c997); color:#fff; border-radius:12px; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold"><i class="fas fa-shopping-cart me-2 text-success"></i>Mi Carrito</h3>
            <a href="catalogo.html" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i>Seguir comprando
            </a>
        </div>

        <div id="contenidoCarrito" class="row g-3"></div>

        <!-- VACÍO -->
        <div id="carritoVacio" class="text-center py-5 d-none">
            <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
            <h5 class="text-muted">Tu carrito está vacío</h5>
            <a href="catalogo.html" class="btn btn-success mt-2">
                <i class="fas fa-store me-1"></i> Ver Catálogo
            </a>
        </div>

        <!-- TOTAL Y PAGAR -->
        <div id="panelTotal" class="card mt-4 border-0 shadow d-none">
            <div class="card-body">
                <div class="total-footer p-3 mb-3 d-flex justify-content-between align-items-center">
                    <span class="fs-5">Total de la compra:</span>
                    <span class="fs-3 fw-bold" id="totalCarrito">Q 0.00</span>
                </div>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a href="catalogo.html" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i>Seguir comprando
                    </a>
                    <a href="checkout.html" class="btn btn-success btn-lg px-5">
                        <i class="fas fa-credit-card me-2"></i>Proceder al Pago
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const usuarioLogueado = localStorage.getItem('usuarioLogueado');
        const idCliente = parseInt(localStorage.getItem('idCliente') || '0');

        if (!usuarioLogueado) {
            document.getElementById('contenidoCarrito').innerHTML =
                `<div class="col-12"><div class="alert alert-warning">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    Debes <a href="login.html" class="fw-bold">iniciar sesión</a> para ver tu carrito.
                </div></div>`;
        } else if (!idCliente) {
            document.getElementById('contenidoCarrito').innerHTML =
                `<div class="col-12"><div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    Tu cuenta no tiene cliente asociado. Cierra sesión, reinicia el servidor y vuelve a ingresar.
                </div></div>`;
        } else {
            cargarCarrito();
        }

        async function cargarCarrito() {
            try {
                const res = await fetch(`http://localhost:8080/api/carrito?idCliente=${idCliente}`);
                const items = await res.json();
                const container = document.getElementById('contenidoCarrito');
                container.innerHTML = '';

                if (items.length === 0) {
                    document.getElementById('carritoVacio').classList.remove('d-none');
                    document.getElementById('panelTotal').classList.add('d-none');
                    return;
                }

                document.getElementById('carritoVacio').classList.add('d-none');
                document.getElementById('panelTotal').classList.remove('d-none');

                let total = 0;
                items.forEach(item => {
                    total += parseFloat(item.subtotal);
                    const div = document.createElement('div');
                    div.className = 'col-12';
                    div.id = `item-${item.idDetalle}`;
                    div.innerHTML = `
                        <div class="card item-card shadow-sm">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-light rounded p-3">
                                        <i class="fas fa-couch fa-2x text-muted"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-1">${item.nombre}</h6>
                                        <small class="text-muted">${item.referencia}</small><br>
                                        <small class="text-muted">
                                            ${item.cantidad} ud. × Q${parseFloat(item.precio).toFixed(2)}
                                        </small>
                                    </div>
                                </div>
                                <div class="text-end">
                                    <div class="fs-5 fw-bold text-success">Q ${parseFloat(item.subtotal).toFixed(2)}</div>
                                    <button class="btn btn-outline-danger btn-sm mt-1"
                                            onclick="eliminarItem(${item.idDetalle})">
                                        <i class="fas fa-trash me-1"></i>Eliminar
                                    </button>
                                </div>
                            </div>
                        </div>`;
                    container.appendChild(div);
                });

                document.getElementById('totalCarrito').textContent = `Q ${total.toFixed(2)}`;
            } catch (e) {
                document.getElementById('contenidoCarrito').innerHTML =
                    `<div class="col-12"><div class="alert alert-danger">
                        Error al cargar el carrito. Verifica que el servidor esté activo.
                    </div></div>`;
            }
        }

        async function eliminarItem(idDetalle) {
            if (!confirm('¿Eliminar este producto del carrito?')) return;
            try {
                const res = await fetch('http://localhost:8080/api/carrito/eliminar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idDetalle })
                });
                const data = await res.json();
                if (data.exito) {
                    cargarCarrito();
                } else {
                    alert('Error: ' + data.mensaje);
                }
            } catch (e) {
                alert('Error de conexión');
            }
        }
    </script>
</body>
</html>
