<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Muebles de los Alpes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .avatar { width: 80px; height: 80px; border-radius: 50%;
                  background: #198754; color:#fff; font-size: 2rem;
                  display:flex; align-items:center; justify-content:center; }
        .card-perfil { border: none; border-radius: 14px; }
        .badge-orden { font-size: 0.85rem; letter-spacing:1px; }
        .estado-PAGADO { color: #198754; }
        .estado-PENDIENTE { color: #ffc107; }
        .estado-CANCELADO { color: #dc3545; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="catalogo.html">
                <i class="fas fa-couch me-2"></i>Muebles de los Alpes
            </a>
            <div class="d-flex gap-2">
                <a href="carrito.html" class="btn btn-warning btn-sm">
                    <i class="fas fa-shopping-cart"></i> Carrito
                </a>
                <a href="catalogo.html" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-store"></i> Catálogo
                </a>
                <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div id="alertaNoLogin" class="alert alert-warning d-none">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Debes <a href="login.html">iniciar sesión</a> para ver tu perfil.
        </div>

        <div id="contenidoPerfil">
            <div class="row g-4">
                <!-- PERFIL -->
                <div class="col-md-4">
                    <div class="card card-perfil shadow-sm h-100">
                        <div class="card-body text-center p-4">
                            <div class="avatar mx-auto mb-3" id="avatarLetra">?</div>
                            <h5 class="fw-bold" id="perfilNombre">Cargando...</h5>
                            <p class="text-muted small" id="perfilEmail"></p>
                            <hr>
                            <div class="text-start small">
                                <p><i class="fas fa-id-card me-2 text-muted"></i>
                                   <span id="perfilDoc"></span></p>
                                <p><i class="fas fa-phone me-2 text-muted"></i>
                                   <span id="perfilTel"></span></p>
                                <p><i class="fas fa-map-marker-alt me-2 text-muted"></i>
                                   <span id="perfilDireccion"></span></p>
                                <p><i class="fas fa-city me-2 text-muted"></i>
                                   <span id="perfilCiudad"></span></p>
                                <p id="perfilPersonaRow"><i class="fas fa-building me-2 text-muted"></i>
                                   <span id="perfilPersona"></span></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- HISTORIAL -->
                <div class="col-md-8">
                    <div class="card card-perfil shadow-sm">
                        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                            <h5 class="mb-0"><i class="fas fa-history me-2"></i>Historial de Compras</h5>
                            <span class="badge bg-success" id="totalOrdenes">0 órdenes</span>
                        </div>
                        <div class="card-body p-0">
                            <div id="listaHistorial">
                                <div class="text-center py-4">
                                    <div class="spinner-border text-success"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const idCliente = parseInt(localStorage.getItem('idCliente') || '0');
        const username = localStorage.getItem('usuarioLogueado') || '';

        if (!idCliente) {
            document.getElementById('alertaNoLogin').classList.remove('d-none');
            document.getElementById('contenidoPerfil').style.display = 'none';
        } else {
            cargarPerfil();
            cargarHistorial();
        }

        async function cargarPerfil() {
            try {
                const res = await fetch(`https://tinsmith-unlocked-squealing.ngrok-free.dev/api/clientes/perfil?idCliente=${idCliente}`, { headers: { 'ngrok-skip-browser-warning': '1' } });
                const p = await res.json();
                document.getElementById('avatarLetra').textContent = p.nombre ? p.nombre[0].toUpperCase() : '?';
                document.getElementById('perfilNombre').textContent = p.nombre;
                document.getElementById('perfilEmail').textContent = p.email;
                document.getElementById('perfilDoc').textContent = `${p.tipoDoc}: ${p.numDoc}`;
                document.getElementById('perfilTel').textContent = p.telResidencia + (p.telCelular ? ` / ${p.telCelular}` : '');
                document.getElementById('perfilDireccion').textContent = p.direccion;
                document.getElementById('perfilCiudad').textContent = `${p.ciudad}, ${p.departamento}`;
                document.getElementById('perfilPersona').textContent = `${p.tipoPersona}${p.nit ? ' – NIT: ' + p.nit : ''}`;
            } catch (e) {
                document.getElementById('perfilNombre').textContent = username;
                document.getElementById('perfilEmail').textContent = 'No disponible';
            }
        }

        async function cargarHistorial() {
            try {
                const res = await fetch(`https://tinsmith-unlocked-squealing.ngrok-free.dev/api/historial?idCliente=${idCliente}`, { headers: { 'ngrok-skip-browser-warning': '1' } });
                const lista = await res.json();
                const contenedor = document.getElementById('listaHistorial');
                document.getElementById('totalOrdenes').textContent = `${lista.length} órdenes`;

                if (lista.length === 0) {
                    contenedor.innerHTML = `<div class="text-center py-5 text-muted">
                        <i class="fas fa-box-open fa-3x mb-3"></i>
                        <p>Aún no has realizado ninguna compra</p>
                        <a href="catalogo.html" class="btn btn-success btn-sm">Ver Catálogo</a>
                    </div>`;
                    return;
                }

                let html = '<div class="list-group list-group-flush">';
                lista.forEach(c => {
                    const estadoClass = `estado-${c.estado}`;
                    html += `<div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <span class="badge bg-dark badge-orden me-2">${c.numeroOrden}</span>
                                <small class="text-muted">${c.fecha}</small>
                            </div>
                            <span class="fw-bold text-success">Q ${parseFloat(c.total).toFixed(2)}</span>
                        </div>
                        <div class="mt-1 small">
                            <i class="fas fa-credit-card me-1 text-muted"></i>${c.formaPago}
                            &nbsp;|&nbsp;
                            <span class="fw-bold ${estadoClass}">${c.estado}</span>
                        </div>
                    </div>`;
                });
                html += '</div>';
                contenedor.innerHTML = html;
            } catch (e) {
                document.getElementById('listaHistorial').innerHTML =
                    '<div class="p-4 text-danger text-center">Error cargando historial</div>';
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
