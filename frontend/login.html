<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mueblería - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 420px; padding: 2rem; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    </style>
</head>
<body>
    <div class="login-card bg-white">
        <h3 class="text-center mb-1">Muebles de los Alpes</h3>
        <p class="text-center text-muted mb-4">Iniciar Sesión</p>

        <div id="alertaMensaje" class="alert d-none" role="alert"></div>

        <form id="formLogin">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" value="Teo" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" value="123456" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
        </form>
        <hr>
        <div class="text-center small">
            <p class="mb-1">¿No tienes cuenta? <a href="registro.html" class="fw-bold">Regístrate aquí</a></p>
            <a href="catalogo.html" class="text-muted">Ver catálogo sin iniciar sesión</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
