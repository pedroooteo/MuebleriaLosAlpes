<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Muebles de los Alpes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .reg-card { border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
                         color: #6c757d; font-weight: 600; border-bottom: 1px solid #dee2e6; padding-bottom: 4px; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card reg-card">
                    <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Crear Cuenta Nueva</h4>
                        <a href="login.html" class="btn btn-sm btn-outline-light">Ya tengo cuenta</a>
                    </div>
                    <div class="card-body p-4">
                        <div id="alerta" class="alert d-none"></div>

                        <form id="formRegistro" novalidate>
                            <!-- DATOS PERSONALES -->
                            <p class="section-title mb-3">Datos Personales</p>
                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Tipo de Documento *</label>
                                    <select class="form-select" id="tipoDoc" required>
                                        <option value="">Seleccionar...</option>
                                        <option value="DPI">DPI</option>
                                        <option value="PASAPORTE">Pasaporte</option>
                                        <option value="NIT">NIT</option>
                                    </select>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label">Número de Documento *</label>
                                    <input type="text" class="form-control" id="numDoc" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Nombre Completo *</label>
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono de Residencia *</label>
                                    <input type="tel" class="form-control" id="telResidencia" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono Celular</label>
                                    <input type="tel" class="form-control" id="telCelular">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Dirección *</label>
                                    <input type="text" class="form-control" id="direccion" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Ciudad *</label>
                                    <select class="form-select" id="idCiudad" required>
                                        <option value="">Cargando ciudades...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Profesión</label>
                                    <input type="text" class="form-control" id="profesion">
                                </div>
                            </div>

                            <!-- TIPO PERSONA -->
                            <p class="section-title mb-3 mt-2">Tipo de Persona</p>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Tipo de Persona *</label>
                                    <select class="form-select" id="tipoPersona" required onchange="toggleNIT()">
                                        <option value="">Seleccionar...</option>
                                        <option value="Natural">Natural</option>
                                        <option value="Juridica">Jurídica</option>
                                    </select>
                                </div>
                                <div class="col-md-6" id="campoNIT" style="display:none">
                                    <label class="form-label">NIT (obligatorio si es Jurídica)</label>
                                    <input type="text" class="form-control" id="nit">
                                </div>
                            </div>

                            <!-- CREDENCIALES -->
                            <p class="section-title mb-3 mt-2">Credenciales de Acceso</p>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Nombre de Usuario *</label>
                                    <input type="text" class="form-control" id="username" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Contraseña *</label>
                                    <input type="password" class="form-control" id="password" required minlength="6">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="btnRegistrar">
                                <i class="fas fa-user-check me-2"></i>Crear Mi Cuenta
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function cargarCiudades() {
            try {
                const res = await fetch('https://tinsmith-unlocked-squealing.ngrok-free.dev/api/ciudades');
                const ciudades = await res.json();
                const sel = document.getElementById('idCiudad');
                sel.innerHTML = '<option value="">Seleccionar ciudad...</option>';
                ciudades.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.idCiudad;
                    opt.textContent = `${c.ciudad} - ${c.departamento}`;
                    sel.appendChild(opt);
                });
            } catch (e) {
                document.getElementById('idCiudad').innerHTML = '<option value="1">Villa Nueva (default)</option>';
            }
        }

        function toggleNIT() {
            const tipo = document.getElementById('tipoPersona').value;
            document.getElementById('campoNIT').style.display = tipo === 'Juridica' ? 'block' : 'none';
        }

        document.getElementById('formRegistro').addEventListener('submit', async function (e) {
            e.preventDefault();
            const alerta = document.getElementById('alerta');
            const btn = document.getElementById('btnRegistrar');

            const datos = {
                tipoDoc: document.getElementById('tipoDoc').value,
                numDoc: document.getElementById('numDoc').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                telResidencia: document.getElementById('telResidencia').value.trim(),
                telCelular: document.getElementById('telCelular').value.trim(),
                direccion: document.getElementById('direccion').value.trim(),
                idCiudad: parseInt(document.getElementById('idCiudad').value),
                email: document.getElementById('email').value.trim(),
                profesion: document.getElementById('profesion').value.trim(),
                tipoPersona: document.getElementById('tipoPersona').value,
                nit: document.getElementById('nit').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            };

            if (!datos.tipoDoc || !datos.numDoc || !datos.nombre || !datos.telResidencia ||
                !datos.direccion || !datos.idCiudad || !datos.email || !datos.tipoPersona ||
                !datos.username || !datos.password) {
                alerta.className = 'alert alert-warning';
                alerta.textContent = 'Por favor completa todos los campos obligatorios (*)';
                alerta.classList.remove('d-none');
                return;
            }

            if (datos.tipoPersona === 'Juridica' && !datos.nit) {
                alerta.className = 'alert alert-warning';
                alerta.textContent = 'El NIT es obligatorio para personas jurídicas';
                alerta.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Registrando...';

            try {
                const res = await fetch('https://tinsmith-unlocked-squealing.ngrok-free.dev/api/registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                const data = await res.json();

                alerta.classList.remove('d-none', 'alert-success', 'alert-danger');
                if (data.exito) {
                    alerta.className = 'alert alert-success';
                    alerta.innerHTML = '<i class="fas fa-check-circle me-2"></i>¡Cuenta creada exitosamente! Redirigiendo al login...';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    alerta.className = 'alert alert-danger';
                    alerta.textContent = data.mensaje || 'Error al registrar';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-check me-2"></i>Crear Mi Cuenta';
                }
            } catch (err) {
                alerta.className = 'alert alert-danger';
                alerta.textContent = 'No se pudo conectar con el servidor';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-check me-2"></i>Crear Mi Cuenta';
            }
        });

        window.onload = cargarCiudades;
    </script>
</body>
</html>
