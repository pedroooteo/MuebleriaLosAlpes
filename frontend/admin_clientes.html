<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Clientes - Muebles de los Alpes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .sidebar { width: 240px; min-height: 100vh; background: #1a1a2e; position: fixed; }
        .sidebar .nav-link { color: #ccc; border-radius: 8px; margin: 2px 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #16213e; color: #fff; }
        .main { margin-left: 240px; padding: 2rem; }
    </style>
</head>
<body>
    <nav class="sidebar d-flex flex-column py-3">
        <div class="text-center mb-4 px-3">
            <i class="fas fa-couch fa-2x text-warning"></i>
            <div class="text-white fw-bold mt-1">Admin Panel</div>
        </div>
        <ul class="nav flex-column">
            <li><a class="nav-link" href="admin.html"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a></li>
            <li><a class="nav-link" href="admin_muebles.html"><i class="fas fa-couch me-2"></i>Muebles</a></li>
            <li><a class="nav-link" href="admin_precios_stock.html"><i class="fas fa-tags me-2"></i>Precios & Stock</a></li>
            <li><a class="nav-link active" href="admin_clientes.html"><i class="fas fa-users me-2"></i>Clientes</a></li>
            <li><a class="nav-link" href="admin_reportes.html"><i class="fas fa-chart-bar me-2"></i>Reportes</a></li>
            <li class="nav-item mt-3"><hr class="border-secondary"></li>
            <li><a class="nav-link" href="catalogo.html"><i class="fas fa-store me-2"></i>Ver Tienda</a></li>
            <li><a class="nav-link text-danger" href="#" onclick="Sesion.cerrar();location.href='login.html'"><i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión</a></li>
        </ul>
    </nav>

    <main class="main">
        <h3 class="fw-bold mb-4"><i class="fas fa-users me-2 text-info"></i>Administración de Clientes</h3>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-md-7">
                        <label class="form-label fw-semibold">Buscar por Número de Documento, Nombre o Email</label>
                        <input type="text" id="inpBuscar" class="form-control" placeholder="Ej: 1234567890101, Juan Pérez, juan@correo.com">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-primary w-100" onclick="buscar()">
                            <i class="fas fa-search me-1"></i>Buscar
                        </button>
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-outline-secondary w-100" onclick="document.getElementById('inpBuscar').value=''; buscar()">
                            <i class="fas fa-list me-1"></i>Todos
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="alertGlobal" class="alert d-none mb-3"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Documento</th><th>Nombre</th><th>Email</th>
                                <th>Ciudad</th><th>Compras</th><th>Eliminar</th>
                            </tr>
                        </thead>
                        <tbody id="tblClientes">
                            <tr><td colspan="6" class="text-center py-4 text-muted">Realiza una búsqueda</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Modal perfil cliente -->
        <div class="modal fade" id="modalPerfil" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title">Perfil del Cliente</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="cuerpoModalPerfil">
                        <div class="text-center"><div class="spinner-border"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="clases.js"></script>
    <script>
        if (!Sesion.requiereAdmin()) {}

        let modalPerfil;

        async function buscar() {
            const criterio = document.getElementById('inpBuscar').value;
            const tbody = document.getElementById('tblClientes');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></td></tr>';
            try {
                const lista = await clienteService.buscar(criterio);
                if (!lista.length) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-3 text-muted">Sin resultados</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                lista.forEach(data => {
                    const c = new Cliente(data);
                    const tr = c.renderFila((cliente) => confirmarEliminar(cliente));
                    // Hacer nombre clicable para ver perfil
                    const tdNombre = tr.cells[1];
                    tdNombre.innerHTML = `<a href="#" class="text-primary" onclick="verPerfil(${c.idCliente})">${c.nombre}</a>`;
                    tbody.appendChild(tr);
                });
            } catch { tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Error al cargar</td></tr>'; }
        }

        async function confirmarEliminar(cliente) {
            if (!confirm(`¿Eliminar al cliente "${cliente.nombre}"?\n\nSolo es posible si no tiene compras registradas.\nSe eliminarán también su usuario y carritos activos.`)) return;
            const alerta = document.getElementById('alertGlobal');
            try {
                const res = await clienteService.eliminar(cliente.idCliente);
                alerta.className = `alert ${res.exito ? 'alert-success' : 'alert-danger'}`;
                alerta.textContent = res.mensaje;
                if (res.exito) buscar();
            } catch {
                alerta.className = 'alert alert-danger';
                alerta.textContent = 'Error de comunicación';
            }
        }

        async function verPerfil(idCliente) {
            modalPerfil = modalPerfil || new bootstrap.Modal(document.getElementById('modalPerfil'));
            document.getElementById('cuerpoModalPerfil').innerHTML = '<div class="text-center"><div class="spinner-border"></div></div>';
            modalPerfil.show();
            try {
                const p = await clienteService.perfil(idCliente);
                document.getElementById('cuerpoModalPerfil').innerHTML = `
                    <dl class="row small mb-0">
                        <dt class="col-5">Nombre</dt><dd class="col-7">${p.nombre}</dd>
                        <dt class="col-5">Email</dt><dd class="col-7">${p.email}</dd>
                        <dt class="col-5">Teléfono</dt><dd class="col-7">${p.telResidencia}</dd>
                        <dt class="col-5">Tipo Doc.</dt><dd class="col-7">${p.tipoDoc} - ${p.numDoc}</dd>
                        <dt class="col-5">Dirección</dt><dd class="col-7">${p.direccion}</dd>
                        <dt class="col-5">Ciudad</dt><dd class="col-7">${p.ciudad || '-'}, ${p.departamento || '-'}</dd>
                        <dt class="col-5">Profesión</dt><dd class="col-7">${p.profesion || '-'}</dd>
                    </dl>`;
            } catch {
                document.getElementById('cuerpoModalPerfil').innerHTML = '<p class="text-danger">Error al cargar perfil</p>';
            }
        }

        buscar();
    </script>
</body>
</html>
