<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagar - Muebles de los Alpes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .pago-card { border: 2px solid #dee2e6; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
        .pago-card:hover, .pago-card.seleccionado { border-color: #198754; background: #f0fff4; }
        .pago-card .icono { font-size: 2rem; }
        .total-box { background: linear-gradient(135deg, #198754, #20c997); color: white;
                     border-radius: 12px; padding: 1.5rem; }
    </style>
</head>
<body class="py-4">
    <div class="container">
        <div class="mb-3">
            <a href="carrito.html" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-arrow-left me-1"></i>Volver al Carrito
            </a>
        </div>

        <div class="row g-4">
            <!-- RESUMEN DEL PEDIDO -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>Resumen del Pedido</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="listaProductos">
                            <div class="text-center py-4">
                                <div class="spinner-border text-success"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-white">
                        <div class="total-box text-center">
                            <p class="mb-1 opacity-75">Total a pagar</p>
                            <h2 class="fw-bold mb-0" id="totalPagar">Q 0.00</h2>
                        </div>
                    </div>
                </div>
            </div>

            <!-- FORMA DE PAGO -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="fas fa-credit-card me-2"></i>Forma de Pago</h5>
                    </div>
                    <div class="card-body">
                        <div id="alerta" class="alert d-none"></div>

                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <div class="pago-card p-3 text-center" onclick="seleccionarPago('Tarjeta', this)">
                                    <div class="icono text-primary mb-2"><i class="fas fa-credit-card"></i></div>
                                    <div class="fw-bold">Tarjeta</div>
                                    <small class="text-muted">Débito/Crédito</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="pago-card p-3 text-center" onclick="seleccionarPago('Efectivo', this)">
                                    <div class="icono text-success mb-2"><i class="fas fa-money-bill-wave"></i></div>
                                    <div class="fw-bold">Efectivo</div>
                                    <small class="text-muted">En tienda</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="pago-card p-3 text-center" onclick="seleccionarPago('Transferencia', this)">
                                    <div class="icono text-warning mb-2"><i class="fas fa-university"></i></div>
                                    <div class="fw-bold">Transferencia</div>
                                    <small class="text-muted">Bancaria</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="pago-card p-3 text-center" onclick="seleccionarPago('Cheque', this)">
                                    <div class="icono text-secondary mb-2"><i class="fas fa-file-invoice"></i></div>
                                    <div class="fw-bold">Cheque</div>
                                    <small class="text-muted">A nombre de la empresa</small>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 p-3 bg-light rounded d-none" id="pagoSeleccionadoBox">
                            <i class="fas fa-check-circle text-success me-2"></i>
                            Forma de pago: <strong id="lblFormaPago"></strong>
                        </div>

                        <div class="mb-3 p-3 bg-light rounded small">
                            <i class="fas fa-info-circle text-primary me-2"></i>
                            Al confirmar, recibirás un correo de confirmación en tu email registrado con el número de orden.
                        </div>

                        <button class="btn btn-success btn-lg w-100 fw-bold" id="btnConfirmar" onclick="confirmarCompra()" disabled>
                            <i class="fas fa-check me-2"></i>Confirmar Compra
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const idCliente = parseInt(localStorage.getItem('idCliente') || '0');
        let formaPagoSeleccionada = '';

        if (!idCliente) {
            alert('Debes iniciar sesión para realizar una compra.');
            window.location.href = 'login.html';
        }

        async function cargarResumen() {
            try {
                const res = await fetch(`http://localhost:8080/api/carrito?idCliente=${idCliente}`);
                const items = await res.json();
                const contenedor = document.getElementById('listaProductos');

                if (items.length === 0) {
                    contenedor.innerHTML = `<div class="p-4 text-center text-muted">
                        <i class="fas fa-shopping-cart fa-2x mb-2"></i><br>El carrito está vacío</div>`;
                    return;
                }

                let total = 0;
                let html = '<ul class="list-group list-group-flush">';
                items.forEach(item => {
                    total += parseFloat(item.subtotal);
                    html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold">${item.nombre}</div>
                            <small class="text-muted">${item.referencia} × ${item.cantidad} ud. @ Q${parseFloat(item.precio).toFixed(2)}</small>
                        </div>
                        <span class="fw-bold text-success">Q ${parseFloat(item.subtotal).toFixed(2)}</span>
                    </li>`;
                });
                html += '</ul>';
                contenedor.innerHTML = html;
                document.getElementById('totalPagar').textContent = `Q ${total.toFixed(2)}`;
            } catch (e) {
                document.getElementById('listaProductos').innerHTML =
                    '<div class="p-4 text-danger">Error cargando el resumen</div>';
            }
        }

        function seleccionarPago(forma, el) {
            document.querySelectorAll('.pago-card').forEach(c => c.classList.remove('seleccionado'));
            el.classList.add('seleccionado');
            formaPagoSeleccionada = forma;
            document.getElementById('lblFormaPago').textContent = forma;
            document.getElementById('pagoSeleccionadoBox').classList.remove('d-none');
            document.getElementById('btnConfirmar').disabled = false;
        }

        async function confirmarCompra() {
            if (!formaPagoSeleccionada) { alert('Selecciona una forma de pago'); return; }
            if (!confirm(`¿Confirmar compra con pago por ${formaPagoSeleccionada}?`)) return;

            const btn = document.getElementById('btnConfirmar');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Procesando...';

            try {
                const res = await fetch('http://localhost:8080/api/compra', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idCliente, formaPago: formaPagoSeleccionada })
                });
                const data = await res.json();

                if (data.exito) {
                    localStorage.setItem('ultimaOrden', data.numeroOrden);
                    localStorage.setItem('ultimaFormaPago', formaPagoSeleccionada);
                    window.location.href = 'confirmacion.html';
                } else {
                    const alerta = document.getElementById('alerta');
                    alerta.className = 'alert alert-danger';
                    alerta.textContent = data.mensaje || 'Error al procesar la compra';
                    alerta.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check me-2"></i>Confirmar Compra';
                }
            } catch (e) {
                alert('Error de conexión con el servidor');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check me-2"></i>Confirmar Compra';
            }
        }

        window.onload = cargarResumen;
    </script>
</body>
</html>
